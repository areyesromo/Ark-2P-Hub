<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/shared/icon.svg">
  <title>Ark 2P Hub · Controller</title>
  <link rel="stylesheet" href="/shared/common.css">
  <link rel="stylesheet" href="/play/play.css">
  <link rel="stylesheet" id="ark-theme" href="/theme.css"> <!-- the look picked in Settings -->
</head>
<body>
  <section id="join-screen" class="join-screen">
    <h1 class="brand"><span class="p1">ARK</span> <span class="p2">2P</span> HUB</h1>
    <form id="join-form" class="panel" autocomplete="off">
      <p id="join-mode" class="join-mode muted"></p>
      <label id="code-label">Room code
        <input id="code" name="code" maxlength="4" inputmode="text" autocapitalize="characters" placeholder="ABCD" required>
      </label>
      <label>Your name
        <input id="name" name="name" maxlength="16" placeholder="Player" required>
      </label>
      <button class="primary" type="submit" id="join-btn">Join game</button>
      <p id="join-error" class="error" role="alert"></p>
      <p class="join-alt muted"><a href="/phone">No TV? Play the 1 player games on this phone alone</a></p>
    </form>
  </section>

  <section id="controller" class="controller hidden">
    <header class="me">
      <button id="me-avatar" class="me-avatar" type="button" aria-label="Change your avatar and colour"><span class="dot"></span></button>
      <span id="me-name" class="me-name"></span>
      <span id="me-tag" class="me-tag"></span>
      <span id="me-conn" class="me-conn"></span>
      <span id="me-clock" class="me-clock hidden"></span>
      <button id="menu-btn" class="ghost menu-btn" aria-label="Menu">⋯</button>
    </header>

    <div id="menu" class="menu hidden">
      <button id="lobby-btn">Back to lobby</button>
      <button id="profile-btn" class="ghost">🎨 Avatar and colour</button>
      <button id="trophies-btn" class="ghost">🏆 My trophies</button>
      <button id="settings-btn" class="ghost hidden">⚙ Settings</button>
      <button id="sound-btn" class="ghost hidden">🔊 Sound is on</button>
      <button id="buzz-btn" class="ghost">📳 Test vibration</button>
      <button id="leave-btn" class="ghost">Leave room</button>
      <p id="buzz-msg" class="buzz-msg hidden"></p>
    </div>

    <!-- Settings, for Player 1 at home: the Settings page, inside this phone so it stays in the room. -->
    <div id="settings-sheet" class="settings-sheet hidden" role="dialog" aria-label="Settings">
      <div class="settings-bar"><strong>⚙ Settings</strong><button id="settings-close" class="primary">Done</button></div>
      <iframe id="settings-frame" title="Settings"></iframe>
    </div>

    <main id="pad" class="pad">
      <div id="phone-lobby" class="phone-lobby">
        <div id="mode-pick" class="mode-pick" role="group" aria-label="Which games">
          <button type="button" class="ghost" data-mode="duo">👥 2 players</button>
          <button type="button" class="ghost" data-mode="solo">👤 1 player</button>
        </div>
        <p id="lobby-status" class="lobby-status"></p>
        <p id="h2h" class="h2h hidden"></p>
        <div id="tourney" class="tourney"></div>
        <div id="phone-games" class="phone-games"></div>
        <div id="solo-links" class="solo-links hidden">
          <a class="btn ghost board-link" data-solo="/solo/me/">📊 My stats</a>
          <a class="btn ghost board-link" data-solo="/trophies/">🏆 Trophies &amp; achievements</a>
          <a class="btn ghost board-link" data-solo="/solo/collection/">🎁 Collection</a>
          <a class="btn ghost board-link" data-solo="/solo/calendar/">📅 Daily calendar</a>
        </div>
        <a class="btn ghost board-link" href="/stats/">🏆 Leaderboard &amp; match history</a>
      </div>
      <div id="phone-stage" class="phone-stage hidden"></div>
      <div id="solo-watch" class="solo-watch hidden"></div>
      <div id="run-over" class="run-over hidden"></div>
      <div id="hub-setup" class="hub-setup hidden"></div>
      <button id="hub-change" class="ghost hub-change hidden">⚙ Change settings</button>
      <div id="tourney-bar" class="tourney-bar hidden"></div>
    </main>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/common.js"></script>
  <script src="/play/play.js"></script>
</body>
</html>
