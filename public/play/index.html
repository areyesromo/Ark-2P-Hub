<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ark 2P Hub · Controller</title>
  <link rel="stylesheet" href="/shared/common.css">
  <link rel="stylesheet" href="/play/play.css">
</head>
<body>
  <section id="join-screen" class="join-screen">
    <h1 class="brand"><span class="p1">ARK</span> <span class="p2">2P</span> HUB</h1>
    <form id="join-form" class="panel" autocomplete="off">
      <label>Room code
        <input id="code" name="code" maxlength="4" inputmode="text" autocapitalize="characters" placeholder="ABCD" required>
      </label>
      <label>Your name
        <input id="name" name="name" maxlength="16" placeholder="Player" required>
      </label>
      <button class="primary" type="submit" id="join-btn">Join game</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="controller" class="controller hidden">
    <header class="me">
      <span class="dot"></span>
      <span id="me-name" class="me-name"></span>
      <span id="me-tag" class="me-tag"></span>
      <span id="me-conn" class="me-conn"></span>
      <button id="menu-btn" class="ghost menu-btn" aria-label="Menu">⋯</button>
    </header>

    <div id="menu" class="menu hidden">
      <button id="lobby-btn">Back to lobby</button>
      <button id="leave-btn" class="ghost">Leave room</button>
    </div>

    <main id="pad" class="pad">
      <div id="phone-lobby" class="phone-lobby">
        <p id="lobby-status" class="lobby-status"></p>
        <p id="h2h" class="h2h hidden"></p>
        <div id="phone-games" class="phone-games"></div>
        <a class="btn ghost board-link" href="/stats/">🏆 Leaderboard &amp; match history</a>
      </div>
      <div id="phone-stage" class="phone-stage hidden"></div>
    </main>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/common.js"></script>
  <script src="/play/play.js"></script>
</body>
</html>
