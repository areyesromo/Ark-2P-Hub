<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/shared/icon.svg">
  <title>Ark 2P Hub</title>
  <link rel="stylesheet" href="/shared/common.css">
  <style>
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px 16px;
      text-align: center;
    }
    h1 { font-size: clamp(2.4rem, 8vw, 5rem); }
    .choices { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    .choices .btn { min-width: 240px; padding: 22px 28px; font-size: 1.2rem; }
  </style>
</head>
<body>
  <main>
    <h1 class="brand"><span class="p1">ARK</span> <span class="p2">2P</span> HUB</h1>
    <p class="muted">1v1 party games. The TV is the screen, your phones are the controllers.</p>
    <div class="choices">
      <a class="btn primary" href="/host/">📺 Host on this screen</a>
      <a class="btn" href="/play/">📱 Join with this phone</a>
    </div>
  </main>
</body>
</html>
