# Builds the desktop app: `npm run dist:linux` (AppImage, for the Steam Deck) and
# `npm run dist:win` (installer; on Windows or in CI). See desktop/README.md.
appId: com.arkhub.ark2p
productName: Ark 2P Hub
artifactName: Ark-2P-Hub-${version}-${arch}.${ext}
directories:
  output: dist
extraMetadata:
  main: desktop/main.js # the app starts here (the Docker image still runs server/index.js)
files:
  - package.json
  - desktop/**
  - server/**
  - public/**
  - "!**/*.test.js"
  - "!desktop/steam/**" # Steam artwork: attached to releases, not needed inside the app
extraResources:
  # electron-builder drops node_modules/*/examples, but three.js keeps the add-ons the 3D party
  # board loads there (served at /vendor/three-addons): ship them beside the app instead.
  - from: node_modules/three/examples/jsm
    to: three-addons
# Self-update reads releases from GitHub (builds write latest.yml / latest-linux.yml for it).
publish:
  provider: github
  owner: areyesromo
  repo: Ark-2P-Hub
# The app icon (tools/desktop-art.mjs draws it); electron-builder makes the .ico from it.
icon: desktop/icons/icon.png
linux:
  # No version in the AppImage's name: an update replaces this same file, so a Steam shortcut to it
  # keeps working.
  artifactName: Ark-2P-Hub-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
  category: Game
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
